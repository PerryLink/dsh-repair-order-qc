# 维修工单结算核对 规则库
#
# 规则数据与代码分离：替换本文件即可切换规则集版本，无需改动 TypeScript。
#
# 条款引用纪律（由 shared/ruleset.ts 强制校验）：
#   - 每条规则必须写全 document / number / clause / excerpt / kind / source，
#     且 excerpt 必须是逐字摘录，不得改写。
#   - kind: direct                       条款直接规定了所检查的要求
#   - kind: derived-from-principle       条款未直接规定，仅能由原则性条款推论（severity 最多 warn）
#   - kind: institutional-configuration 阈值出自本机构配置（severity 最多 info）
#
# ⚠️⚠️ 本规则库最要紧的说明：**它核对的是算术，不是修理质量。**
#   本插件核对的是"机动车维修工单"的费用与要素自洽：
#     客户反映与施工内容是否填写、项目数量与单价是否可解析、
#     项目金额是否等于数量乘单价、明细金额合计是否等于结算总额、
#     配件费与工时费与折扣是否与总额相符、进厂与出厂日期是否先后成立、
#     工单号是否重复、是否残留模板占位符。
#   其规范载体是**《机动车维修管理规定》（交通运输部令）**关于维修结算与竣工出厂的规定，
#   以及 **GB/T 16739《汽车维修业开业条件》**等。
#   **核查未取得这些文件的逐字条文**，故每条 excerpt 如实写明，kind 降为 derived-from-principle（封顶 warn）。
#
# ⚠️⚠️ 另一条**必须保留**的边界：**本插件绝不判定维修项目是否必要、
#   收费是否合理、是否存在过度维修、维修质量是否合格**。
#   那需要结合车辆实际状况、技术规范与维修合同判断，是维修技术人员与消费者的判断。
#   → **工时费率（laborRate）由台账或本机构配置提供**，本插件**不内置任何费率标准**。
#   → 本插件也**不判断配件是否为原厂件**：它只看台账写的是什么。

plugin: dsh-repair-order-qc
version: "2026.1"

rules:
  - id: RO-001
    title: 工单应记录客户反映与施工内容
    severity: warn
    basis:
      document: 《机动车维修管理规定》
      number: 交通运输部令2021年第18号（2005 年公布，经 2015、2016、2019、2021 年四次修正，自 2005 年 8 月 1 日起施行）
      clause: 第三十三条（维修档案应当包括：维修合同（托修单）、维修项目、维修人员及维修结算清单等）
      excerpt: 机动车维修经营者应当建立机动车维修档案，并实行档案电子化管理。维修档案应当包括：维修合同（托修单）、维修项目、维修人员及维修结算清单等。对机动车进行二级维护、总成修理、整车修理的，维修档案还应当包括：质量检验单、质量检验人员、竣工出厂合格证（副本）等。
      kind: direct
      source: https://jtyst.fj.gov.cn/zwgk/zcfg/flfg/202109/t20210918_5691618.htm
    params:
        check:
          kind: presenceAny
          fields: ["customerConcern","workDone"]
          fix: 补填客户反映与施工内容；本条只核对是否记录，不判断维修是否必要
    note: >-
      ✅ **本条 excerpt 已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-repair-regulation.md）。
      ✅ kind 已升为 direct（2026-10-07）：第三十三条逐字规定「维修档案应当包括：维修合同（托修单）、**维修项目**、维修人员及维修结算清单等」——"客户反映与施工内容"正是维修合同与维修项目两项在工单上的落点。
      "客户反映了什么、我们做了什么"是维修工单的**最低可核对信息**：
      缺其一，结算与实际作业就无法对应，争议时也无从举证。
      本次未取得明文条号，故封顶 warn。
      本条只核对"至少填了一个"，**不判断该故障描述是否属实、施工内容是否正确**。

  - id: RO-002
    title: 项目金额应等于数量乘单价
    severity: warn
    basis:
      document: 《机动车维修管理规定》
      number: 交通运输部令2021年第18号（2005 年公布，经 2015、2016、2019、2021 年四次修正，自 2005 年 8 月 1 日起施行）
      clause: 第二十六条（维修结算清单；工时费与材料费应当分项计算；维修费用明细单）
      excerpt: 机动车维修经营者应当使用规定的结算票据，并向托修方交付维修结算清单，作为托修方追责依据。维修结算清单中，工时费与材料费应当分项计算。维修结算清单应当符合交通运输部有关标准要求，维修结算清单内容应包括托修方信息、承修方信息、维修费用明细单等。
      kind: direct
      source: https://jtyst.fj.gov.cn/zwgk/zcfg/flfg/202109/t20210918_5691618.htm
    params:
        check:
          kind: productOf
          resultField: amount
          factorFields: ["quantity","unitPrice"]
          tolerance: 0.01
    note: >-
      ✅ **本条 excerpt 已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-repair-regulation.md）。
      ✅ kind 已升为 direct（2026-10-07）：第二十六条逐字要求结算清单「内容应包括托修方信息、承修方信息、**维修费用明细单**等」——"数量×单价"即明细单的算术。
      金额 = 数量 × 单价是**定义式**，属纯算术核对；本次未取得明文条号，故封顶 warn。
      本条只在三个字段都有可解析数值时执行；缺任一项即进 skipped。
      容差出厂 0.01，用于容纳小数进位。
      本条**不判断单价是否合理、该项目是否应当发生** —— 那需要技术规范与维修合同。

  - id: RO-003
    title: 明细金额合计应与结算总额一致
    severity: warn
    basis:
      document: 《机动车维修管理规定》
      number: 交通运输部令2021年第18号（2005 年公布，经 2015、2016、2019、2021 年四次修正，自 2005 年 8 月 1 日起施行）
      clause: 第二十六条（维修结算清单；工时费与材料费应当分项计算；维修费用明细单）
      excerpt: 机动车维修经营者应当使用规定的结算票据，并向托修方交付维修结算清单，作为托修方追责依据。维修结算清单中，工时费与材料费应当分项计算。维修结算清单应当符合交通运输部有关标准要求，维修结算清单内容应包括托修方信息、承修方信息、维修费用明细单等。
      kind: direct
      source: https://jtyst.fj.gov.cn/zwgk/zcfg/flfg/202109/t20210918_5691618.htm
    params:
        check:
          kind: sum
          field: amount
          headerField: total
          tolerance: 0.01
    note: >-
      ✅ **本条 excerpt 已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-repair-regulation.md）。
      ✅ kind 已升为 direct（2026-10-07）：同第二十六条——明细单的存在即要求明细与总额自洽。
      明细合计与总额相符是结算的**算术前提**：不一致时无法判断以哪个为准。
      本次未取得明文条号，故封顶 warn。
      本条的总额取自**材料表头**的结算总额（引擎会先在行内找，再回落到表头）。
      容差出厂 0.01。本条只做加法核对，**不判断各项收费是否合理**。

  - id: RO-004
    title: 结算总额应等于配件费加工时费减折扣
    severity: warn
    basis:
      document: 《机动车维修管理规定》
      number: 交通运输部令2021年第18号（2005 年公布，经 2015、2016、2019、2021 年四次修正，自 2005 年 8 月 1 日起施行）
      clause: 第二十六条（维修结算清单；工时费与材料费应当分项计算；维修费用明细单）
      excerpt: 机动车维修经营者应当使用规定的结算票据，并向托修方交付维修结算清单，作为托修方追责依据。维修结算清单中，工时费与材料费应当分项计算。维修结算清单应当符合交通运输部有关标准要求，维修结算清单内容应包括托修方信息、承修方信息、维修费用明细单等。
      kind: direct
      source: https://jtyst.fj.gov.cn/zwgk/zcfg/flfg/202109/t20210918_5691618.htm
    params:
        check:
          kind: formula
          resultField: total
          expression: {"op":"sum","fields":["partsTotal","laborTotal","discount"],"signs":[1,1,-1]}
          tolerance: 0.01
    note: >-
      ✅ **本条 excerpt 已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-repair-regulation.md）。
      ✅ kind 已升为 direct（2026-10-07）：第二十六条逐字要求「**工时费与材料费应当分项计算**」——"配件费加工时费减折扣"正是这一分项要求的算术表达。
      维修结算的常用构成是 **配件费 + 工时费 − 折扣 = 结算总额**。
      本条把它写成"三者按 −折扣 的口径相加应等于总额"，从而**只读台账里实际存在的三栏**
      （配件费合计、工时费合计、折扣），不要求台账另设一个"税前合计"栏。
      本次未取得明文条号，故封顶 warn。
      折算式的等价形式是 `total + discount − partsTotal − laborTotal = 0`，容差出厂 0.01。
      ⚠️ 本条依赖材料提供**配件费与工时费两栏合计**（引擎会先查行、再查表头）。
      若本机构工单没有这两栏合计，本条进 skipped —— **不会假定任何构成**。
      折扣栏口径为"减免金额"；若本机构用折扣率，请改用其它检查或停用本条。
      本次未取得明文条号，故封顶 warn。
      ⚠️ 本式计算依赖材料提供**配件费与工时费的合计**（引擎会先查行、再查表头）。
      若本机构工单没有这两栏合计，本条进 skipped —— **不会假定任何构成**。
      折扣栏出厂口径为"减免金额"；若本机构用折扣率，请改用其它检查或停用本条。

  - id: RO-005
    title: 出厂日期不应早于进厂日期
    severity: warn
    basis:
      document: 《机动车维修管理规定》
      number: 交通运输部令2021年第18号（2005 年公布，经 2015、2016、2019、2021 年四次修正，自 2005 年 8 月 1 日起施行）
      clause: 第三十二条（竣工质量检验合格方可出厂交付）—— 但"出厂日期不早于进厂日期"本身是本规定未明文的时间自洽要求
      excerpt: 机动车维修竣工质量检验合格的，维修质量检验人员应当签发《机动车维修竣工出厂合格证》（见附件3）；未签发机动车维修竣工出厂合格证的机动车，不得交付使用，车主可以拒绝交费或接车。
      kind: derived-from-principle
      source: https://jtyst.fj.gov.cn/zwgk/zcfg/flfg/202109/t20210918_5691618.htm
    params:
        check:
          kind: date
          field: receivedAt
          notAfterField: deliveredAt
          fix: 出厂日期不应早于进厂日期；核对两个日期的填写
    note: >-
      ✅ **本条 excerpt 已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-repair-regulation.md）。
      ⚠️ kind 仍为 derived-from-principle：第三十二条规范的是**竣工检验合格才能出厂**，与"出厂日期不早于进厂日期"这一时间先后无关。本规定通篇无此明文要求，该顺序属台账自身的时间自洽。
      "先进厂、后出厂"是维修流程的**时间前提**；日期可解析是工单能被程序处理的前提。
      本次未取得明文条号，故封顶 warn。
      本条只比较两个日期（同一天视为不晚于），**不判断维修工期是否合理**。
      日期无法解析时会单独报出，**不会静默跳过**。

  - id: RO-006
    title: 工单号不应在台账内重复
    severity: warn
    basis:
      document: 《机动车维修管理规定》
      number: 交通运输部令2021年第18号（2005 年公布，经 2015、2016、2019、2021 年四次修正，自 2005 年 8 月 1 日起施行）
      clause: 第三十三条（维修档案及档案电子化管理）
      excerpt: 机动车维修经营者应当建立机动车维修档案，并实行档案电子化管理。维修档案应当包括：维修合同（托修单）、维修项目、维修人员及维修结算清单等。对机动车进行二级维护、总成修理、整车修理的，维修档案还应当包括：质量检验单、质量检验人员、竣工出厂合格证（副本）等。
      kind: derived-from-principle
      source: https://jtyst.fj.gov.cn/zwgk/zcfg/flfg/202109/t20210918_5691618.htm
    params:
        check:
          kind: unique
          field: orderNo
    note: >-
      ✅ **本条 excerpt 已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-repair-regulation.md）。
      ⚠️ kind 仍为 derived-from-principle：第三十三条要求建立维修档案并电子化管理，未规定工单号不得重复。
      工单号唯一是"每张工单只被登记一次"的**前提条件**：
      重复会让费用合计被重复计算，也会让档案无法对应。
      本次未取得明文条号，故封顶 warn。比较时忽略空白字符。
      注意：同一张工单分多行登记不同项目是正常的，此时应在项目名称栏区分而非重复工单号。

  - id: RO-007
    title: 项目名称栏不应残留未替换的占位符
    severity: warn
    basis:
      document: 《机动车维修管理规定》
      number: 交通运输部令2021年第18号（2005 年公布，经 2015、2016、2019、2021 年四次修正，自 2005 年 8 月 1 日起施行）
      clause: 第三十三条（维修项目）
      excerpt: 机动车维修经营者应当建立机动车维修档案，并实行档案电子化管理。维修档案应当包括：维修合同（托修单）、维修项目、维修人员及维修结算清单等。对机动车进行二级维护、总成修理、整车修理的，维修档案还应当包括：质量检验单、质量检验人员、竣工出厂合格证（副本）等。
      kind: derived-from-principle
      source: https://jtyst.fj.gov.cn/zwgk/zcfg/flfg/202109/t20210918_5691618.htm
    params:
        check:
          kind: containsAny
          field: itemName
          terms: ["【","】","{{","}}","XXX","xxx","待填","待补充","TBD","todo","示例"]
          fix: 项目名称应填写实际内容；残留占位符说明工单是照模板抄的
    note: >-
      ✅ **本条 excerpt 已于 2026-10-07 换为逐字引文**（见 rules/evidence/clause-verification-repair-regulation.md）。
      ⚠️ kind 仍为 derived-from-principle：第三十三条未就占位符作任何规定。
      工单常由模板复制而来，项目名称栏留下【】、XXX、待填、TBD 之类占位符时，
      会让人误以为已经确定了维修项目 —— **而一份没有项目的工单是不能结算的**。
      本次未取得明文条号，故封顶 warn。terms 可按本机构模板调整。

disabled: []
